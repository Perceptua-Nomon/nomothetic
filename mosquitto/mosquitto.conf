# nomon MQTT broker — local/dev configuration.
#
# Anonymous access is intentional: nomothetic's TelemetryPublisher and
# TelemetryConsumer (paho-mqtt clients, see src/nomothetic/telemetry.py and
# telemetry_consumer.py) implement no username/password auth. Network-layer
# trust (Tailscale / LAN) is the security boundary here, consistent with the
# device-mode REST API (see docs/architecture.md).

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
